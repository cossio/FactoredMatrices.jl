name: Documentation

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

jobs:
  build:
    # Permissions and layout follow the workflow recommended by Documenter:
    # https://documenter.juliadocs.org/stable/man/hosting/#GitHub-Actions
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32
        with:
          version: '1'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38
      - name: Install dependencies
        # The [sources] entry in docs/Project.toml resolves FactoredMatrices to
        # the local checkout (no Pkg.develop needed).
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
        run: julia --project=docs docs/make.jl
